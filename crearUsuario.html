<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Registro - Universidad Veracruzana</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
            width: 80%;
            max-width: 1100px;
            min-height: 600px;
        }

        .left-panel {
            background-color: #0047AB;
            color: #fff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 50%;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-img {
            max-width: 200px;
            max-height: 200px;
        }

        .university-name {
            font-size: 1.5em;
            text-align: center;
        }

        .right-panel {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 50%;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
            background-color: #fff;
            color: #333;
        }

        .form-group select {
             appearance: menulist;
            -webkit-appearance: menulist;
            -moz-appearance: menulist;
        }


        .action-button {
            background-color: #0047AB;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .action-button:hover {
            background-color: #003380;
        }

        .back-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background-color: #6c757d; 
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
            text-decoration: none; 
            margin-top: 10px; 
        }

        .back-button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo-container">
                <img src="logo_uv.jpg" alt="Universidad Veracruzana Logo" class="logo-img">
            </div>
            <h1 class="university-name">Universidad Veracruzana</h1>
        </div>
        <div class="right-panel">
            <h2 style="text-align: center; margin-bottom: 20px;">Crear Cuenta</h2>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <div class="form-group">
                <label for="id_institucional">ID institucional</label>
                <input type="text" id="id_institucional" name="id_institucional" required>
            </div>
            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="" disabled selected>Seleccione un rol...</option>
                    <option value="empleado">Empleado</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>
            <button type="submit" class="action-button">Aceptar</button>
            <a href="sesion.html" class="back-button">Volver</a>
        </div>
    </div>
</body>
</html>
